<!doctype html>
<html lang="de" data-mode="ski" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bergtage</title>
<meta name="description" content="Ski- und Biketage planen: Wetter, Schnee, Andrang, TopCard-Rechner, Kalender, Gruppen und Statistik.">
<meta name="theme-color" content="#0B1D33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230B1D33'/%3E%3Cpath d='M4 25l8-14 4.5 6.5L20 13l8 12z' fill='none' stroke='%23F4511E' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
/* Thema und Modus vor dem ersten Zeichnen setzen, damit nichts aufblitzt. */
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem('bergtage.v1')) || {}; } catch (e) {}
  var t = s.theme || 'system';
  if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.mode = s.mode === 'bike' ? 'bike' : 'ski';
})();
</script>
</head>
<body>
<canvas id="topo" aria-hidden="true"></canvas>

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19l6.5-11 3.5 5 2.5-3.5L22 19z"/></svg>
    Bergtage
  </div>
  <div class="bar-right">
    <div class="mode" id="mode" role="group" aria-label="Sportart"></div>
    <button class="icon-btn" data-act="settings" aria-label="Einstellungen" id="btn-settings"></button>
  </div>
</header>

<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/resorts.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
